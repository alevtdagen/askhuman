[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "askhuman-agent"
version = "0.1.0"
description = "Give any agent a human when it gets stuck."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3"]

[project.urls]
Repository = "https://github.com/alevtdagen/askhuman"
Issues = "https://github.com/alevtdagen/askhuman/issues"

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "build>=1.2"]
langchain = ["langchain-core>=0.3,<2"]
openai = ["openai-agents>=0.2,<1"]

[project.scripts]
askhuman = "askhuman.cli:main"
askhuman-mcp = "askhuman.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
askhuman = ["web/*", "skill/*", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
